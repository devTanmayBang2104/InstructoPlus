# ========================================================
# INSTRUCTOPLUS - FULL STACK PRODUCTION DOCKER COMPOSE
# Services:
#   1. mongo    : MongoDB 7.0 Document Database
#   2. redis    : Redis 7.2 In-Memory Cache & Message Broker
#   3. backend  : Express 5 API Server + BullMQ Worker
#   4. frontend : React 19 / Vite SPA served via Nginx Reverse Proxy
# ========================================================

version: '3.8'

services:
  # --------------------------------------------------------
  # 1. MongoDB Database Service
  # --------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: instructoplus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - instructoplus-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # 2. Redis In-Memory Cache & BullMQ Queue Broker
  # --------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: instructoplus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - instructoplus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # 3. Node.js Express Backend & BullMQ Worker
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instructoplus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URL=mongodb://mongo:27017/instructoplus
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=instructoplus_super_secret_production_key_2026
      - RAZORPAY_KEY_ID=rzp_test_placeholder_key
      - RAZORPAY_KEY_SECRET=rzp_test_placeholder_secret
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - instructoplus-network

  # --------------------------------------------------------
  # 4. React Vite Frontend served via Nginx
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: instructoplus-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - instructoplus-network

# --------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# --------------------------------------------------------
# Isolated Application Network
# --------------------------------------------------------
networks:
  instructoplus-network:
    driver: bridge
